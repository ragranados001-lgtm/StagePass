<!DOCTYPE html>

<head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">StagePass</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link active" href="eventos.html">Eventos</a></li>
          <li class="nav-item"><a class="nav-link" href="eventos.html">Categorías</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#acerca">Acerca de</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="hero compact text-center">
    <div class="container py-4">
      <h1>Eventos</h1>
      <p class="lead">Descubre conciertos, festivales y más.</p>
    </div>
  </header>

  <main class="container py-4">
    <form id="filterForm" class="filter-panel mb-4">
      <div class="row g-3">
        <div class="col-lg-6"><input id="eventSearch" type="search" class="form-control" placeholder="Buscar evento o artista..."></div>
        <div class="col-lg-2"><button class="btn btn-stage w-100" type="submit">Buscar</button></div>
        <div class="col-md-3 col-lg-2"><select id="cityFilter" class="form-select"><option value="">Ciudad</option><option>Ciudad de México</option><option>Monterrey</option><option>Guadalajara</option></select></div>
        <div class="col-md-3 col-lg-2"><select id="categoryFilter" class="form-select"><option value="">Categoría</option><option>Concierto</option></select></div>
      </div>
    </form>

    <section>
      <div class="d-flex justify-content-between align-items-center mb-3"><h2 class="section-title mb-0">Resultados</h2><span id="resultCount" class="text-secondary"></span></div>
      <div id="eventList"></div>
      <nav aria-label="Paginación" class="mt-4">
        <ul class="pagination justify-content-center">
          <li class="page-item active"><a class="page-link" href="#">1</a></li><li class="page-item"><a class="page-link" href="#">2</a></li><li class="page-item"><a class="page-link" href="#">3</a></li><li class="page-item"><a class="page-link" href="#">›</a></li>
        </ul>
      </nav>
    </section>

  </footer>

  <script src="js/app.js"></script>
